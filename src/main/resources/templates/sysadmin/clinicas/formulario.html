<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
	<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<div class="app-content">
		<header th:replace="~{fragments/header :: header(${pageTitle})}"></header>
		<main class="main-content">
			<form class="form form-card" th:action="@{/sysadmin/clinicas}" th:object="${clinica}" method="post" novalidate>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

				<div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</div>

				<section class="form-section" aria-labelledby="dados-clinica-title">
					<p class="section-label" id="dados-clinica-title">Dados da clínica</p>

					<div class="field">
						<label for="nome">Nome</label>
						<input id="nome" type="text" th:field="*{nome}" th:attr="aria-invalid=${#fields.hasErrors('nome')}" required>
						<span class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</span>
					</div>

					<div class="field">
						<label for="cnpj">CNPJ</label>
						<input id="cnpj" type="text" th:field="*{cnpj}" th:attr="aria-invalid=${#fields.hasErrors('cnpj')}" maxlength="14" required>
						<span class="field-error" th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}">Erro</span>
					</div>

					<div class="field">
						<label for="email">E-mail</label>
						<input id="email" type="email" th:field="*{email}" th:attr="aria-invalid=${#fields.hasErrors('email')}" maxlength="200" required>
						<span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro</span>
					</div>

					<div class="field">
						<label for="telefone">Contato</label>
						<input id="telefone" type="text" th:field="*{telefone}" th:attr="aria-invalid=${#fields.hasErrors('telefone')}" maxlength="20">
						<span class="field-error" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">Erro</span>
					</div>

					<div class="field">
						<label for="endereco">Endereço</label>
						<input id="endereco" type="text" th:field="*{endereco}" th:attr="aria-invalid=${#fields.hasErrors('endereco')}" maxlength="255">
						<span class="field-error" th:if="${#fields.hasErrors('endereco')}" th:errors="*{endereco}">Erro</span>
					</div>
				</section>

				<div class="form-actions">
					<a class="button button-secondary" th:href="@{/sysadmin/clinicas}">Cancelar</a>
					<button class="button button-primary" type="submit">Cadastrar clínica</button>
				</div>
			</form>
		</main>
	</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
	<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<div class="app-content">
		<header th:replace="~{fragments/header :: header(${pageTitle})}"></header>
		<main class="main-content">
			<form class="form form-card" th:action="@{/sysadmin/usuarios}" th:object="${usuario}" method="post" novalidate>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

				<div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</div>

				<section class="form-section" aria-labelledby="dados-conta-title">
					<p class="section-label" id="dados-conta-title">Dados da conta</p>
					<p class="field-helper">Primeiro acesso: o usuário utilizará o e-mail cadastrado como login e senha inicial. No primeiro acesso, será obrigatório definir uma nova senha.</p>

					<div class="field">
						<label for="nome">Nome</label>
						<input id="nome" type="text" th:field="*{nome}" th:attr="aria-invalid=${#fields.hasErrors('nome')}" autocomplete="name" required>
						<span class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</span>
					</div>

					<div class="field">
						<label for="login">E-mail / Login</label>
						<input id="login" type="email" th:field="*{login}" th:attr="aria-invalid=${#fields.hasErrors('login')}" autocomplete="username" maxlength="72" required>
						<span class="field-error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}">Erro</span>
					</div>
				</section>

				<section class="form-section" aria-labelledby="perfil-acesso-title">
					<p class="section-label" id="perfil-acesso-title">Perfil de acesso</p>

					<div class="field">
						<label for="tipo">Perfil</label>
						<select id="tipo" th:field="*{tipo}" th:attr="aria-invalid=${#fields.hasErrors('tipo')}" required>
							<option value="">Selecione...</option>
							<option th:each="tipo : ${tipos}" th:value="${tipo.name()}" th:text="${tipo.name() == 'SYSADMIN' ? 'SysAdmin' : tipo.name() == 'ADMIN_CLINICA' ? 'Administrador da Clínica' : tipo.name() == 'VETERINARIO' ? 'Veterinário' : 'Responsável'}">Perfil</option>
						</select>
						<p class="field-helper context-helper" th:hidden="${usuario.tipo != null}">Selecione o perfil para definir o vínculo necessário.</p>
						<span class="field-error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">Erro</span>
					</div>
				</section>

				<section class="form-section" id="vinculo-section" th:hidden="${usuario.tipo == null or usuario.tipo.name() == 'SYSADMIN'}" aria-labelledby="vinculo-title">
					<p class="section-label" id="vinculo-title">Vínculo</p>

					<div class="field context-field" data-context="ADMIN_CLINICA" th:hidden="${usuario.tipo == null or usuario.tipo.name() != 'ADMIN_CLINICA'}">
						<label for="clinicaId">Clínica</label>
						<select id="clinicaId" th:field="*{clinicaId}">
							<option value="">Selecione...</option>
							<option th:each="clinica : ${clinicas}" th:value="${clinica.id}" th:text="${clinica.label}">Clínica</option>
						</select>
					</div>

					<div class="field context-field" data-context="VETERINARIO" th:hidden="${usuario.tipo == null or usuario.tipo.name() != 'VETERINARIO'}">
						<label for="veterinarioId">Veterinário</label>
						<select id="veterinarioId" th:field="*{veterinarioId}">
							<option th:if="${!#lists.isEmpty(veterinarios)}" value="">Selecione...</option>
							<option th:if="${#lists.isEmpty(veterinarios)}" value="" disabled>Nenhum veterinário disponível</option>
							<option th:each="veterinario : ${veterinarios}" th:value="${veterinario.id}" th:text="${veterinario.label}">Veterinário</option>
						</select>
					</div>

					<div class="field context-field" data-context="RESPONSAVEL" th:hidden="${usuario.tipo == null or usuario.tipo.name() != 'RESPONSAVEL'}">
						<label for="responsavelId">Responsável</label>
						<select id="responsavelId" th:field="*{responsavelId}">
							<option th:if="${!#lists.isEmpty(responsaveis)}" value="">Selecione...</option>
							<option th:if="${#lists.isEmpty(responsaveis)}" value="" disabled>Nenhum responsável disponível</option>
							<option th:each="responsavel : ${responsaveis}" th:value="${responsavel.id}" th:text="${responsavel.label}">Responsável</option>
						</select>
					</div>
				</section>

				<div class="form-actions">
					<a class="button button-secondary" th:href="@{/sysadmin/usuarios}">Cancelar</a>
					<button class="button button-primary" type="submit">Criar usuário</button>
				</div>
			</form>
		</main>
	</div>
</div>
<script>
	(() => {
		const tipo = document.querySelector("#tipo");
		const section = document.querySelector("#vinculo-section");
		const helper = document.querySelector(".context-helper");
		const fields = [...document.querySelectorAll(".context-field")];
		const update = () => {
			const selectedRole = tipo.value;
			const needsContext = ["ADMIN_CLINICA", "VETERINARIO", "RESPONSAVEL"].includes(selectedRole);
			if (section) {
				section.hidden = !needsContext;
			}
			if (helper) {
				helper.hidden = selectedRole !== "";
			}
			fields.forEach((field) => {
				const visible = field.dataset.context === selectedRole;
				const select = field.querySelector("select");
				field.hidden = !visible;
				if (select) {
					select.disabled = !visible;
					select.required = visible;
					if (!visible) {
						select.value = "";
					}
				}
			});
		};
		if (tipo) {
			tipo.addEventListener("change", update);
			update();
		}
	})();
</script>
</body>
</html>

spring.application.name=arkive
spring.profiles.default=oracle
server.port=${PORT:8080}
spring.jpa.open-in-view=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
arkive.clinical-engine.base-url=${ARKIVE_CLINICAL_ENGINE_URL:https://arkive-clinical-engine.onrender.com}
arkive.clinical-engine.connect-timeout=10s
arkive.clinical-engine.read-timeout=120s
arkive.azure.speech.endpoint=${AZURE_SPEECH_ENDPOINT:}
arkive.azure.speech.api-key=${AZURE_SPEECH_API_KEY:}
arkive.azure.speech.max-upload-size=10MB
arkive.azure.speech.recognition-timeout=120s
arkive.azure.speech.conversion-timeout=30s
arkive.azure.speech.sdk-operation-timeout=10s
arkive.azure.speech.max-concurrent-requests=1
arkive.azure.speech.phrase-list-biasing-weight=1.3
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
